services:
  data-to-rag-api:
    image: python:3.11-slim
    container_name: data-to-rag-api
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - APP_PORT=8000
    depends_on:
      - qdrant
    command: sh -c "pip install --no-cache-dir -r requirements.txt && uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: data-to-rag-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
